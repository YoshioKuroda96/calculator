<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="電卓">
<meta name="theme-color" content="#DDE1E5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161A1F" media="(prefers-color-scheme: dark)">
<title>電卓</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#DDE1E5; --panel:#EEF0F2; --key:#FAFBFC; --key-press:#E2E6EA;
  --op:#23466B; --op-text:#FFFFFF; --op-press:#1A3552;
  --eq:#F0A500; --eq-text:#1B1F24; --eq-press:#D38F00;
  --fn:#C9CFD6; --fn-press:#B6BDC6; --sci:#E4E8EC; --sci-press:#D3D9DF;
  --ink:#1B1F24; --muted:#66707C; --line:#C4CAD1; --err:#B3261E; --caret:#E08E00;
  --unit:#0B6E5E; --unit-bg:rgba(11,110,94,.14);
  --num-font:"Barlow Semi Condensed","Barlow","Helvetica Neue",Arial,sans-serif;
  --ui-font:"Barlow","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161A1F; --panel:#1F242B; --key:#2A3038; --key-press:#353C46;
    --op:#3D6FA3; --op-text:#FFFFFF; --op-press:#335E8C;
    --eq:#F0A500; --eq-text:#161A1F; --eq-press:#D38F00;
    --fn:#3A424C; --fn-press:#465059; --sci:#242A31; --sci-press:#2F363F;
    --ink:#EDF0F3; --muted:#8C96A2; --line:#343B44; --err:#FF8A80; --caret:#F0A500;
    --unit:#5EEAD4; --unit-bg:rgba(94,234,212,.17);
  }
}
:root[data-theme="dark"]{
  --bg:#161A1F; --panel:#1F242B; --key:#2A3038; --key-press:#353C46;
  --op:#3D6FA3; --op-text:#FFFFFF; --op-press:#335E8C;
  --eq:#F0A500; --eq-text:#161A1F; --eq-press:#D38F00;
  --fn:#3A424C; --fn-press:#465059; --sci:#242A31; --sci-press:#2F363F;
  --ink:#EDF0F3; --muted:#8C96A2; --line:#343B44; --err:#FF8A80; --caret:#F0A500;
  --unit:#5EEAD4; --unit-bg:rgba(94,234,212,.17);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--ui-font);
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
  overscroll-behavior:none; touch-action:manipulation;
}
.app{height:100%; max-width:480px; margin:0 auto; display:flex; flex-direction:column}

/* ---- 上部バー ---- */
.bar{display:flex; justify-content:flex-end; align-items:center; padding:4px 10px 0}
.bar .count{font-size:13px; color:var(--muted); padding-left:6px}
.linkbtn{border:0; background:transparent; color:var(--muted); font:500 14px var(--ui-font); padding:10px 8px; border-radius:10px; cursor:pointer}
.linkbtn{background:var(--fn); color:var(--ink); font-weight:600; padding:7px 14px; margin:4px 0; border-radius:999px; border:1px solid var(--line); box-shadow:0 1px 0 var(--line)}
.linkbtn:active{background:var(--fn-press)}
.modebar{display:flex; justify-content:space-between; align-items:center; padding:0 10px 2px; flex:0 0 auto}
.modebar .linkbtn{height:34px; line-height:1; display:inline-flex; align-items:center; justify-content:center; padding-top:0; padding-bottom:0}
.linkbtn.on{background:var(--op); color:var(--op-text); border-color:var(--op)}
.linkbtn.on:active{background:var(--op-press)}

/* ---- 履歴テープ（新しいものが下） ---- */
.tape{flex:1 1 auto; min-height:60px; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 16px}
.tape-inner{min-height:100%; display:flex; flex-direction:column; justify-content:flex-end}
.entry{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:8px 0; border-bottom:1px solid var(--line); min-height:48px}
.entry .ex{
  flex:1 1 auto; min-width:0; text-align:left; white-space:nowrap; overflow-x:auto; scrollbar-width:none;
  font:400 19px/1.6 var(--num-font); color:var(--muted);
  cursor:pointer; padding:2px 4px; margin-left:-4px; border-radius:6px;
}
.entry .rs{
  flex:0 0 auto; max-width:60%; overflow-x:auto; white-space:nowrap; scrollbar-width:none;
  font:500 26px var(--num-font); font-variant-numeric:tabular-nums; text-align:right;
  cursor:pointer; padding:0 6px; margin-right:-6px; border-radius:8px;
}
.entry .ex::-webkit-scrollbar,.entry .rs::-webkit-scrollbar{display:none}
.entry .ex:active,.entry .rs:active{background:var(--panel)}
.entry.flash .rs{background:var(--sci)}
.entry.flashx .ex{background:var(--sci)}
.hint{color:var(--muted); font-size:14px; line-height:1.7; text-align:center; padding:24px 8px}

/* ---- 入力中の式 ---- */
.current{flex:0 0 auto; padding:10px 16px 12px; border-top:2px solid var(--line); min-height:96px; display:flex; flex-direction:column; justify-content:flex-end}
.input{
  font:400 32px/1.25 var(--num-font); text-align:right; word-break:break-all;
  min-height:40px; max-height:45vh; overflow-y:auto; padding-top:4px; cursor:text;
}
.input .t{display:inline}
.input .t.op{padding:0 .12em}
.input .t.word{color:var(--op)}
.t.xv{font-family:"Times New Roman",Georgia,serif; font-style:italic; color:var(--op); padding:0 .04em}
.t.eqs{padding:0 .28em; color:var(--ink); font-weight:500}
.k.xkey{font:italic 500 24px "Times New Roman",Georgia,serif; color:var(--op)}
.t.unit{font-family:var(--ui-font); font-size:.72em; font-weight:700; color:var(--unit); background:var(--unit-bg); border-radius:6px; padding:.05em .32em; margin:0 .14em 0 .12em; letter-spacing:.01em}
.t.arrow{padding:0 .25em; color:var(--muted)}
.entry{flex-wrap:wrap}
.entry .rs .ru{font-family:var(--ui-font); font-size:.62em; font-weight:700; color:var(--unit); background:var(--unit-bg); border-radius:6px; padding:.06em .4em; margin-left:.4em}
.entry .rs .ru.can{text-decoration:underline dotted; text-underline-offset:4px; cursor:pointer}
.toast{position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 58px); transform:translateX(-50%) translateY(-6px); max-width:88%; padding:9px 18px; border-radius:999px; background:var(--op); color:var(--op-text); font:600 14px var(--ui-font); opacity:0; pointer-events:none; transition:opacity .15s, transform .15s; z-index:30; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--key); color:var(--err); border:1px solid var(--err)}
.conv{flex-basis:100%; display:flex; flex-wrap:wrap; justify-content:flex-end; gap:6px; padding:6px 0 2px}
.cv{border:1px solid var(--line); background:var(--key); color:var(--ink); border-radius:999px; padding:6px 13px; font:500 15px var(--ui-font); cursor:pointer}
.cv:active{background:var(--key-press)}
.k.tool.unitkey{font:600 15px var(--ui-font)}
.k.tool.on{background:var(--op); color:var(--op-text)}
.k.sci.cat{font:600 15px var(--ui-font)}
.k.sci.cat.sel{background:var(--op); color:var(--op-text)}
.k.sci.cat small{font-size:10px; margin-left:3px; opacity:.85}
.k.sci.unitk{font:700 17px var(--ui-font); color:var(--unit)}
.k.sci.blank{visibility:hidden}
.k.conv-key{font-size:26px; color:var(--op)}
.preview.hint{color:var(--muted); font:400 13px var(--ui-font)}
.input .ghost{color:var(--muted); opacity:.55}
.caret{display:inline-block; width:2px; height:1.05em; background:var(--caret); vertical-align:-0.15em; margin:0 -1px; animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.input{line-height:1.6}
.frac{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; font-size:.86em; margin:0 .12em; line-height:1.2}
.frac .num{padding:0 .18em .04em; border-bottom:2px solid currentColor; min-width:.8em; text-align:center}
.frac .den{padding:.04em .18em 0; min-width:.8em; text-align:center}
.frac .divmark{display:inline-block; width:0}
.pow{display:inline}
.sup{display:inline-block; font-size:.62em; vertical-align:1.05em; line-height:1; margin-left:.04em}
.sup .frac{font-size:.95em}
.root{display:inline-flex; align-items:stretch; margin:0 .06em; vertical-align:bottom}
.rsign{display:inline-block; line-height:1.25; padding-top:.02em; cursor:text; font-family:"Times New Roman",serif; transform:scaleY(1.08); transform-origin:bottom}
.radicand{display:inline-block; border-top:2px solid currentColor; padding:.06em .14em 0 .06em; margin-left:-.02em; line-height:1.25}
.entry .ex .radicand{border-top-width:1.5px}
.mark{display:inline-block; width:0}
.ph{display:inline-block; width:.6em; height:.8em; border:1.5px dashed var(--muted); border-radius:3px; vertical-align:middle; opacity:.75; cursor:text}
.entry .ex .frac .num{border-bottom-width:1.5px}
.preview{font:400 20px var(--num-font); color:var(--muted); text-align:right; min-height:26px}
.preview.err{color:var(--err); font-family:var(--ui-font); font-size:14px}

/* ---- キーパッド ---- */
.pad{
  flex:0 0 auto; display:grid; grid-template-columns:repeat(5,1fr); gap:7px;
  background:var(--panel); padding:10px 10px 12px; border-radius:20px 20px 0 0;
}
.k{
  touch-action:manipulation; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
  height:54px; border:0; border-radius:12px; cursor:pointer;
  font:400 27px var(--num-font); color:var(--ink); background:var(--key);
  box-shadow:0 1px 0 var(--line); transition:transform .05s, background .05s;
}
.k:active,.k.hit{transform:translateY(1px); background:var(--key-press)}
.k.tool{height:40px; background:var(--fn); font:500 16px var(--ui-font)}
.k.tool:active,.k.tool.hit{background:var(--fn-press)}
.k.sci{height:42px; background:var(--sci); font:500 18px var(--num-font)}
.k.sci:active,.k.sci.hit{background:var(--sci-press)}
.k.op{background:var(--op); color:var(--op-text); font-size:30px}
.k.op:active,.k.op.hit{background:var(--op-press)}
.k.eq{background:var(--eq); color:var(--eq-text); font-size:32px; font-weight:500; grid-column:span 2;
  display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; gap:3px; transition:background .15s, color .15s}
.k.eq .sym{font:500 30px var(--num-font)}
.k.eq .sym i{font-family:"Times New Roman",Georgia,serif; font-weight:500}
.k.eq .cap{font:600 11px var(--ui-font); letter-spacing:.02em; opacity:.85}
.k.eq.st-calc .cap,.k.eq.st-rhs .cap{display:none}
.k.eq.st-rhs .sym{display:inline-flex; align-items:center; gap:6px; white-space:nowrap; line-height:1}
.k.eq.st-rhs .e1{display:block; font:500 26px/1 var(--num-font); transform:translateY(1px)}
.k.eq.st-rhs .e2{display:block; font:600 16px/1 var(--ui-font)}
.k.eq.st-rhs{background:var(--op); color:var(--op-text)}
.k.eq.st-rhs:active{background:var(--op-press)}
.k.eq.st-solve{background:var(--eq); color:var(--eq-text); box-shadow:0 0 0 2px var(--op) inset}
.k.eq:active,.k.eq.hit{background:var(--eq-press)}
body:focus{outline:none}
.k:focus-visible,.linkbtn:focus-visible{outline:3px solid var(--eq); outline-offset:2px}
@media (max-height:700px){ .k{height:46px} .k.sci{height:36px} .k.tool{height:34px} .current{min-height:80px} .input{font-size:28px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} .caret{animation:none} }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    
    <button class="linkbtn" id="clearHist">履歴を消去</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="tape" id="tape"><div class="tape-inner" id="tapeInner"></div></div>

  <div class="current">
    <div class="input" id="input" aria-label="入力中の式"></div>
    <div class="preview" id="preview" aria-live="polite"></div>
  </div>

  <div class="modebar"><button class="linkbtn" id="degBtn" aria-label="角度の単位を切り替える">DEG</button><button class="linkbtn" id="copyBtn" aria-pressed="false" aria-label="Tap action for history: INSERT (insert into input) or CLIP COPY (copy to clipboard)">INSERT</button></div>

  <div class="pad" id="pad">
    <button class="k tool" data-k="AC" aria-label="入力を消す">AC</button>
    <button class="k tool" data-k="LEFT" aria-label="カーソルを左へ">◀</button>
    <button class="k tool" data-k="RIGHT" aria-label="カーソルを右へ">▶</button>
    <button class="k tool unitkey" data-k="UNIT" id="unitKey" aria-label="単位キーに切り替える" aria-pressed="false">単位</button>
    <button class="k tool" data-k="BS" aria-label="1つ消す">⌫</button>

    <button class="k sci" data-k="sin(">sin</button>
    <button class="k sci" data-k="cos(">cos</button>
    <button class="k sci" data-k="tan(">tan</button>
    <button class="k sci" data-k="log(">log</button>
    <button class="k sci" data-k="ln(">ln</button>

    <button class="k sci" data-k="π">π</button>
    <button class="k sci" data-k="^">xʸ</button>
    <button class="k sci" data-k="√(">√</button>
    <button class="k sci" data-k="ans">ans</button>
    <button class="k sci xkey" data-k="X" aria-label="変数X">X</button>

    <button class="k" data-k="7">7</button>
    <button class="k" data-k="8">8</button>
    <button class="k" data-k="9">9</button>
    <button class="k" data-k="(">(</button>
    <button class="k" data-k=")">)</button>

    <button class="k" data-k="4">4</button>
    <button class="k" data-k="5">5</button>
    <button class="k" data-k="6">6</button>
    <button class="k op" data-k="×" aria-label="掛ける">×</button>
    <button class="k op" data-k="÷" aria-label="割る（分数）">/</button>

    <button class="k" data-k="1">1</button>
    <button class="k" data-k="2">2</button>
    <button class="k" data-k="3">3</button>
    <button class="k op" data-k="+" aria-label="足す">+</button>
    <button class="k op" data-k="−" aria-label="引く">−</button>

    <button class="k" data-k="0">0</button>
    <button class="k" data-k=".">.</button>
    <button class="k" data-k="%" id="pctKey">%</button>
    <button class="k eq st-calc" data-k="=" id="eqKey" aria-label="計算する"><span class="sym">=</span><span class="cap"></span></button>
  </div>
</div>

<script>
(() => {
  const FUNCS = {
    'sin(': (x,d)=>trig(Math.sin,x,d),
    'cos(': (x,d)=>trig(Math.cos,x,d),
    'tan(': (x,d)=>{ const r=d?x*Math.PI/180:x; if(Math.abs(Math.cos(r))<1e-12) throw new Error('tan の値が定義されない角度です'); return snap(Math.tan(r)); },
    '√(':  x=>{ if(x<0) throw new Error('負の数の √ は計算できません'); return Math.sqrt(x); },
    'log(':x=>{ if(x<=0) throw new Error('log は正の数だけ計算できます'); return Math.log10(x); },
    'ln(': x=>{ if(x<=0) throw new Error('ln は正の数だけ計算できます'); return Math.log(x); },
  };
  const OPS=['+','−','×','÷','^'];
  const snap=v=>Math.round(v*1e14)/1e14;
  function trig(f,x,d){ return snap(f(d?x*Math.PI/180:x)); }

  // ===== 単位 =====
  // d = [長さ, 質量, 時間, 電流] の指数、f = SI基準（m・kg・s・A）に対する倍率
  const DL=[1,0,0,0], DM=[0,1,0,0], DT=[0,0,1,0], DI=[0,0,0,1], DSP=[1,0,-1,0], DFO=[1,1,-2,0];
  const MU='\u03BCm';
  const G=9.80665;   // 標準重力加速度 [m/sec²]：1 kg重 = 9.80665 N
  const UNITS={
    [MU]:{label:MU,d:DL,f:1e-6}, 'mm':{label:'mm',d:DL,f:1e-3}, 'cm':{label:'cm',d:DL,f:1e-2}, 'm':{label:'m',d:DL,f:1}, 'km':{label:'km',d:DL,f:1e3},
    'g':{label:'g',d:DM,f:1e-3}, 'kg':{label:'kg',d:DM,f:1}, 't':{label:'t',d:DM,f:1e3}, 'N':{label:'N',d:DFO,f:1},
    'msec':{label:'msec',d:DT,f:1e-3}, 'sec':{label:'sec',d:DT,f:1}, 'min':{label:'min',d:DT,f:60}, 'h':{label:'h',d:DT,f:3600},
    'mm/sec':{label:'mm/sec',d:DSP,f:1e-3}, 'm/sec':{label:'m/sec',d:DSP,f:1}, 'm/min':{label:'m/min',d:DSP,f:1/60}, 'm/h':{label:'m/h',d:DSP,f:1/3600}, 'km/h':{label:'km/h',d:DSP,f:1000/3600},
  };
  const UNIT_KEYS=Object.keys(UNITS);
  // 単位キーパッドの並び
  const CATS=[['speed','速度'],['time','時間'],['len','距離'],['mass','質量']];
  const UNIT_PAGES={len:[[MU,'mm','cm','m','km']], mass:[['g','kg','t','N']], time:[['msec','sec','min','h']],
                    speed:[['mm/sec','m/sec','m/min','m/h','km/h']]};
  const isUnit=t=>typeof t==='string'&&t.startsWith('u:');
  const D0=[0,0,0,0];
  const Q=(v,d=D0,u={})=>({v,d,u});
  const dimEq=(a,b)=>a.every((x,i)=>Math.abs(x-b[i])<1e-9);
  const isDimless=q=>dimEq(q.d,D0);
  const uMerge=(a,b,sg)=>{ const r={...a}; for(const k in b){ r[k]=(r[k]||0)+sg*b[k]; if(Math.abs(r[k])<1e-9) delete r[k]; } return r; };
  const uScale=(a,sc)=>{ const r={}; for(const k in a){ const p=a[k]*sc; if(Math.abs(p)>1e-9) r[k]=p; } return r; };
  const qMul=(a,b)=>Q(a.v*b.v, a.d.map((x,i)=>x+b.d[i]), uMerge(a.u,b.u,1));
  const qDiv=(a,b)=>{ if(b.v===0) throw new Error('0 で割ることはできません'); return Q(a.v/b.v, a.d.map((x,i)=>x-b.d[i]), uMerge(a.u,b.u,-1)); };
  function qAdd(a,b,sg){
    if(!dimEq(a.d,b.d)){
      const mf=(dimEq(a.d,DM)&&dimEq(b.d,DFO))||(dimEq(a.d,DFO)&&dimEq(b.d,DM));
      throw new Error(mf?'kg と N は足し算・引き算できません（→ で換算してから計算）':'単位の種類が違うため、足し算・引き算できません');
    }
    return Q(a.v+sg*b.v, a.d, Object.keys(a.u).length?a.u:b.u);   // 単位は左側（先に出た方）に揃える
  }
  const unitQ=key=>{ const U=UNITS[key]; if(!U) throw new Error('「'+key+'」は使えない単位です'); return Q(U.f,U.d,{[key]:1}); };
  // 単位の組み合わせを表示用の文字に（例：kg·m/s²）
  function unitMapLabel(u){
    const sup=p=>p===1?'':Number.isInteger(p)?String(p).replace(/./g,c=>({'-':'⁻'})[c]||'⁰¹²³⁴⁵⁶⁷⁸⁹'[c]):'^'+(+p.toFixed(3));
    const nm=k=>k.includes('/')?'('+k+')':k;
    const pos=Object.keys(u).filter(k=>u[k]>0), neg=Object.keys(u).filter(k=>u[k]<0);
    let s=pos.map(k=>nm(k)+sup(u[k])).join('·')||'1';
    if(neg.length) s+='/'+neg.map(k=>nm(k)+sup(-u[k])).join('·');
    return s;
  }
  // 結果を表示する単位を決める
  //  ① 式の単位を組み合わせた倍率と一致する単位（m/min×min→m、V×A→W、W×h→Wh）
  //  ② 式に出てきた同じ種類の単位  ③ その種類の基本単位  ④ 式の単位の組み合わせのまま
  function displayUnit(q){
    if(isDimless(q)) return null;
    const keys=Object.keys(q.u);
    const f=keys.reduce((a,k)=>a*Math.pow(UNITS[k].f,q.u[k]),1);
    const same=UNIT_KEYS.filter(k=>dimEq(UNITS[k].d,q.d));
    const pick=k=>({label:UNITS[k].label,f:UNITS[k].f,u:{[k]:1}});
    const exact=same.find(k=>Math.abs(UNITS[k].f-f)<=1e-9*Math.max(UNITS[k].f,f));
    if(exact) return pick(exact);

  // ---- 式の評価（evalを使わない） ----
  function openCount(tokens){ let n=0; for(const t of tokens){ if(t.endsWith('(')) n++; else if(t===')') n--; } return n; }

  // 式を評価して「数量」{v:SI基準の値, d:次元, u:使った単位の組み合わせ} を返す
  function evalQ(tokens, deg, xv){

    }
    function unary(){ const tk=peek(); if(tk&&tk.o==='−'){ next(); const q=unary(); return Q(-q.v,q.d,q.u); } if(tk&&tk.o==='+'){ next(); return unary(); } return power(); }
    function power(){

        next(); const e=unary();
        if(!isDimless(e)) throw new Error('指数に単位は使えません');

    }

      if(tk.o==='X'){ if(xv===undefined) throw new Error('X を含む式は = で右辺を入力してください'); return Q(xv); }
      if(isUnit(tk.o)) return unitQ(tk.o.slice(2));          // 数値なしの単位は「1 単位」
      if(tk.o==='('){ const v=expr(); expect(); return v; }
      if(FUNCS[tk.o]){
        const a=expr(); expect();
        if(tk.o==='√('){ if(a.v<0) throw new Error('負の数の √ は計算できません'); return Q(Math.sqrt(a.v),a.d.map(x=>x/2),uScale(a.u,0.5)); }
        if(!isDimless(a)) throw new Error('sin・cos・tan・log・ln の中では単位は使えません');
        return Q(FUNCS[tk.o](a.v,deg));
      }
      if(tk.o==='→') throw new Error('→ は式の最後に1つだけ使えます');
      throw new Error('「'+tk.o+'」の位置が正しくありません');

    function expect(){ const c=next(); if(!c||c.o!==')') throw new Error('かっこの対応が正しくありません'); }

    const v=expr();
    if(p<t.length) throw new Error('「'+(t[p].o||t[p].n)+'」の位置が正しくありません');
    if(!isFinite(v.v)) throw new Error('計算できる範囲を超えました');

  // 式を計算して履歴1行分を作る（→ があれば単位変換）
  function computeEntry(tokens){

  function fmt(v){

  function buildItems(tokens,start,inGroup){
    let i=start; const items=[], len=tokens.length;

  function renderExpr(tokens,parent){

  function valueTokens(v){

  function entryValueTokens(h){

  // 式のコピー用テキスト（キーボードで打つ形。この電卓にそのまま貼り付け直せる）
  function tokensToText(tokens){
    const M={'÷':'/','−':'-','÷(':'/(','√(':'sqrt(','π':'pi','→':'->'};   // × と X はそのまま
    let out='';
    for(let i=0;i<tokens.length;i++){
      const t=tokens[i];
      if(t==='÷('||t==='^('){          // 分母・指数が数字だけ（または X・π・ans 1つ）なら、かっこを省いて読みやすく
        let d=0,j=i; for(;j<tokens.length;j++){ if(tokens[j].endsWith('(')) d++; else if(tokens[j]===')'){ d--; if(d===0) break; } }

        // 内側がすでに1組のかっこで囲まれているときは、外側のかっこを省く（8/((2+2)) → 8/(2+2)）

  const inputEl=document.getElementById('input'), previewEl=document.getElementById('preview');
  const eqKey=document.getElementById('eqKey');
  const degBtn=document.getElementById('degBtn');

  function matchOpenIn(arr,i){ let d=0; for(let j=i;j>=0;j--){ const t=arr[j]; if(t===')') d++; else if(t.endsWith('(')){ d--; if(d===0) return j; } } return -1; }
  // 履歴の式に含まれる ans を、その時点までの履歴をさかのぼって実際の式に展開する（表示専用）
  function expandAnsTokens(tokens, beforeIdx){
    const out=[];
    for(const t of tokens){
      if(t==='ans'){
        if(beforeIdx>=0){
          const ref=S.history[beforeIdx];
          const inner=(ref.t.includes('=')||ref.t.includes('→'))?entryValueTokens(ref):expandAnsTokens(ref.t, beforeIdx-1);
          for(let n=openCount(inner);n>0;n--) inner.push(')');   // 閉じ忘れのかっこを補ってから埋め込む
          if(inner.every(t=>/^[0-9.]$/.test(t))||(/^[0-9.]$/.test(inner[0])&&inner.every(t=>/^[0-9.]$/.test(t)||isUnit(t)))) out.push(...inner); else if(inner[0]==='('&&matchOpenIn(inner,inner.length-1)===0) out.push(...inner); else out.push('(',...inner,')');
        } else out.push('0');
      } else out.push(t);
    }
    return out;
  }

  function renderTape(){
    tapeInner.innerHTML='';
    S.history.forEach((h,idx)=>{
      const e=document.createElement('div'); e.className='entry';
      const ex=document.createElement('div'); ex.className='ex'; renderExpr(expandAnsTokens(h.t,idx-1),ex); if(!h.sol) ex.appendChild(document.createTextNode(' ='));
      const rs=document.createElement('div'); rs.className='rs';
      if(h.sol) rs.textContent=solText(h.sol);
      else{
        const num=document.createElement('span'); num.textContent=fmt(h.v/(h.f||1)); rs.appendChild(num);
        if(h.d){
          const un=document.createElement('span'); un.className='ru'; un.textContent=h.lab; rs.appendChild(un);
          if(convCandidates(h).length){
            un.classList.add('can'); un.setAttribute('role','button'); un.setAttribute('aria-label',h.lab+' を別の単位に変換');
            un.addEventListener('click',ev=>{ ev.stopPropagation(); const st=tapeEl.scrollTop; convOpen=convOpen===idx?null:idx; renderTape(); if(idx<S.history.length-1) tapeEl.scrollTop=st; });
          }
        }
      }
      // 式をクリック：コピーOFF → 入力欄へ式を挿入 ／ コピーON → 式と答えをクリップボードへコピー
      ex.addEventListener('click',()=>{
        if(S.copyMode) copyAnswer(exprResultText(h,idx)); else insertHistoryExpr(h,idx);
        e.classList.add('flashx'); setTimeout(()=>e.classList.remove('flashx'),180);
      });
      // 答えをクリック：コピーOFF → 入力欄へ答えを挿入 ／ コピーON → 答え（単位つきなら単位つき）をコピー
      rs.addEventListener('click',()=>{
        if(S.copyMode) copyAnswer(answerText(h));
        else if(!h.sol) insert(entryValueTokens(h)); else if(h.sol.roots.length) insert(valueTokens(h.v));
        e.classList.add('flash'); setTimeout(()=>e.classList.remove('flash'),180);
      });
      e.append(ex, rs);
      if(convOpen===idx){
        const cv=document.createElement('div'); cv.className='conv';
        convCandidates(h).forEach(k=>{ const c=document.createElement('button'); c.className='cv'; c.textContent=UNITS[k].label;
          c.addEventListener('click',ev=>{ ev.stopPropagation(); convertEntry(h,k); }); cv.appendChild(c); });
        e.appendChild(cv);
      }
      tapeInner.appendChild(e);
    });
    tapeEl.scrollTop=tapeEl.scrollHeight;
  }

  // 履歴の答えを別の単位に変換して、新しい行として追加
  function convertEntry(h,k){
    try{ commitEntry(computeEntry([...entryValueTokens(h),'→','u:'+k])); convOpen=null; save(); renderTape(); renderInput(); }
    catch(e){ previewEl.classList.remove('hint'); previewEl.textContent=e.message; previewEl.classList.add('err'); }
  }

  function renderInput(){
    inputEl.innerHTML='';
    renderExpr(S.tokens,inputEl);
    const caret=document.createElement('span'); caret.className='caret';
    const phAt=inputEl.querySelector(`.ph[data-c="${S.cursor}"]`);
    if(phAt) phAt.before(caret);
    else if(S.cursor===0){ const f=inputEl.querySelector('[data-i="0"]'); f?f.before(caret):inputEl.appendChild(caret); }
    else inputEl.querySelector(`[data-i="${S.cursor-1}"]`).after(caret);
    // プレビュー
    previewEl.classList.remove('err');
    previewEl.classList.remove('hint'); previewEl.textContent='';
    // = ボタンの状態：通常計算 → 右辺へ → X を解く
    const st=eqState();
    eqKey.className='k eq st-'+st;
    if(st==='calc'){ eqKey.querySelector('.sym').textContent='='; eqKey.querySelector('.cap').textContent=''; eqKey.setAttribute('aria-label','計算する'); }
    if(st==='rhs'){ eqKey.querySelector('.sym').innerHTML='<span class="e1">=</span><span class="e2">右辺へ</span>'; eqKey.querySelector('.cap').textContent=''; eqKey.setAttribute('aria-label','= を入れて右辺を入力する'); }
    if(st==='solve'){ eqKey.querySelector('.sym').innerHTML='<i>X</i> を求める'; eqKey.querySelector('.sym').style.fontSize='18px'; eqKey.querySelector('.cap').textContent='';
      eqKey.setAttribute('aria-label','X を求める'); }
    if(st!=='solve') eqKey.querySelector('.sym').style.fontSize='';
    degBtn.textContent=S.deg?'DEG':'RAD';
    caret.scrollIntoView({block:'nearest'});
    tapeEl.scrollTop=tapeEl.scrollHeight;  // 入力欄が伸びても履歴の最新行を見えるように
  }

  // ---- 入力操作 ----
  // 履歴の式を、入力済みの式を残したままカーソル位置に挿入する（ans は展開済みの式で入る）
  function insertHistoryExpr(h,idx){
    const t=expandAnsTokens(h.t,idx-1);
    for(let n=openCount(t);n>0;n--) t.push(')');
    if(!S.tokens.length){                       // 入力が空ならそのまま入れる
      S.tokens=[...t]; S.cursor=t.length; renderInput(); return;
    }
    const ai=t.indexOf('→'); if(ai>=0) t.splice(ai);   // 単位変換の行は → の前の式だけを挿入
    if(t.includes('=')){                        // 方程式は途中に挿入できない
      previewEl.classList.remove('hint'); previewEl.textContent='方程式は入力欄が空のときだけ呼び出せます'; previewEl.classList.add('err'); return;
    }
    // 入力済みの式の途中に入れても計算順序が変わらないよう、かっこで囲む
    const single=t.length===1 && !/^[0-9.]$/.test(t[0]);
    const ins=single?t:['(',...t,')'];
    S.tokens.splice(S.cursor,0,...ins); S.cursor+=ins.length; renderInput();
  }
  function insert(arr){
    if(!S.tokens.length && ['+','−','×','÷','^','%','÷(','^('].includes(arr[0]) && S.history.length) arr=['ans',...arr];
    S.tokens.splice(S.cursor,0,...arr); S.cursor+=arr.length; renderInput();
  }
  function matchOpen(i){ let d=0; for(let j=i;j>=0;j--){ const t=S.tokens[j]; if(t===')') d++; else if(t.endsWith('(')){ d--; if(d===0) return j; } } return -1; }
  function matchClose(i){ let d=0; for(let j=i;j<S.tokens.length;j++){ const t=S.tokens[j]; if(t.endsWith('(')) d++; else if(t===')'){ d--; if(d===0) return j; } } return -1; }
  function eqState(){ return S.tokens.includes('=')?'solve':S.tokens.includes('X')?'rhs':'calc'; }
  function solText(sol){
    if(sol.kind==='all') return 'すべての X';
    if(!sol.roots.length) return '解なし';
    return 'X = '+sol.roots.map(fmt).join(', ')+(sol.more?', …':'');
  }
  // 左辺 − 右辺 = 0 となる X を数値的に求める
  function solveX(L,R){
    if(!L.includes('X')&&!R.includes('X')) throw new Error('X を式に入れてください');
    if([...L,...R].some(t=>isUnit(t)||t==='→')||([...L,...R].includes('ans')&&S.ansQ&&!isDimless(S.ansQ))) throw new Error('方程式では単位は使えません');
    const g=x=>{ try{ const v=evaluate(L,S.ans,S.deg,x)-evaluate(R,S.ans,S.deg,x); return isFinite(v)?v:NaN; }catch(e){ return NaN; } };
    // 書き方の誤りは、どの X でも同じエラーになるので先に報告
    const probe=[0.37,1.9,-2.6,11.3,-0.041]; let firstErr=null, anyOk=false;
    for(const x of probe){ try{ evaluate(L,S.ans,S.deg,x); evaluate(R,S.ans,S.deg,x); anyOk=true; }catch(e){ firstErr=firstErr||e; } }
    if(!anyOk && firstErr && /途中|かっこ|位置|書き方|空/.test(firstErr.message)) throw firstErr;

    // 1次式ならそのまま解く
    const g0=g(0), g1=g(1), g2=g(2), gm=g(-3.7);
    if([g0,g1,g2,gm].every(isFinite)){
      const sc=Math.max(1,Math.abs(g0),Math.abs(g1),Math.abs(g2),Math.abs(gm));
      const a=g1-g0;
      if(Math.abs(g2-2*g1+g0)<=1e-10*sc && Math.abs(gm-(g0-3.7*a))<=1e-10*sc){
        if(Math.abs(a)<=1e-12*sc) return Math.abs(g0)<=1e-12*sc?{kind:'all',roots:[]}:{roots:[]};
        return {roots:[clean(-g0/a)]};
      }
    }
    // 非線形：±1e-6〜1e6 を走査して符号変化・極小を探す
    const xs=[0]; const N=1200;
    for(let i=0;i<=N;i++){ const m=Math.pow(10,-6+12*i/N); xs.push(m,-m); }
    xs.sort((a,b)=>a-b);
    const ys=xs.map(g); const cand=[];
    for(let i=0;i<xs.length;i++){
      if(ys[i]===0) cand.push({t:'z',x:xs[i]});
      if(i+1<xs.length&&isFinite(ys[i])&&isFinite(ys[i+1])&&ys[i]*ys[i+1]<0) cand.push({t:'b',a:xs[i],b:xs[i+1],ga:ys[i],gb:ys[i+1]});
      if(i>0&&i+1<xs.length&&[ys[i-1],ys[i],ys[i+1]].every(isFinite)&&Math.abs(ys[i])<Math.abs(ys[i-1])&&Math.abs(ys[i])<Math.abs(ys[i+1])&&ys[i-1]*ys[i+1]>0&&ys[i]*ys[i-1]>0)
        cand.push({t:'m',a:xs[i-1],b:xs[i+1],s:Math.max(Math.abs(ys[i-1]),Math.abs(ys[i+1]))});
    }
    const near=c=>Math.min(Math.abs(c.x??c.a),Math.abs(c.b??c.x));
    cand.sort((p,q)=>near(p)-near(q));
    const roots=[];
    for(const c of cand.slice(0,60)){
      if(c.t==='z'){ roots.push(c.x); continue; }
      if(c.t==='b'){
        let a=c.a,b=c.b,ga=c.ga;
        for(let k=0;k<200&&b-a>1e-15*Math.max(1,Math.abs(a));k++){ const m=(a+b)/2, gm2=g(m); if(!isFinite(gm2)) break; if(gm2===0){a=b=m;break;} if(ga*gm2<0) b=m; else {a=m;ga=gm2;} }
        const r=(a+b)/2, gr=Math.abs(g(r));
        if(isFinite(gr)&&gr<=1e-7*Math.max(1,Math.min(Math.abs(c.ga),Math.abs(c.gb)))) roots.push(r); // 極（1/X など）は除外
        continue;
      }
      // 接する解（例：(X−3)^2=0）
      let a=c.a,b=c.b;
      for(let k=0;k<200;k++){ const m1=a+(b-a)/3, m2=b-(b-a)/3; if(Math.abs(g(m1))<Math.abs(g(m2))) b=m2; else a=m1; }
      const r=(a+b)/2; if(Math.abs(g(r))<=1e-9*Math.max(1,c.s)) roots.push(r);
    }
    const uniq=[];
    for(const r of roots.map(clean).sort((a,b)=>a-b)) if(!uniq.some(u=>Math.abs(u-r)<=1e-7*Math.max(1,Math.abs(r)))) uniq.push(r);
    if(!uniq.length){
      if(!anyOk&&firstErr) throw firstErr;
      return {roots:[]};
    }
    // 0 に近い順に最大5個を表示
    const pick=[...uniq].sort((a,b)=>Math.abs(a)-Math.abs(b)).slice(0,5).sort((a,b)=>a-b);
    return {roots:pick, more:uniq.length>5};
  }
  const clean=v=>{ const r=parseFloat(v.toPrecision(12)); const n=Math.round(r); return Math.abs(r-n)<1e-9*Math.max(1,Math.abs(n))?n:r; };
  const BOXES=['√(','^(','÷('];  // ▶で抜けるまで中にとどまる枠
  function press(k){
    switch(k){
      case 'AC': S.tokens=[]; S.cursor=0; renderInput(); return;
      case 'BS': {
        if(S.cursor<=0) return;
        const i=S.cursor-1, t=S.tokens[i];
        if(t===')'){ const o=matchOpen(i); if(o>=0&&BOXES.includes(S.tokens[o])){ S.cursor--; renderInput(); return; } }
        if(BOXES.includes(t)){ const c=matchClose(i); if(c>=0) S.tokens.splice(c,1); }
        S.tokens.splice(i,1); S.cursor--; renderInput(); return;
      }
      case '√(': insert(['√(',')']); S.cursor--; renderInput(); return;
      case '^':  insert(['^(',')']); S.cursor--; renderInput(); return;
      case '÷':  insert(['÷(',')']); S.cursor--; renderInput(); return;
      case 'LEFT': S.cursor=Math.max(0,S.cursor-1); renderInput(); return;
      case 'RIGHT': S.cursor=Math.min(S.tokens.length,S.cursor+1); renderInput(); return;
      case 'DEG': S.deg=!S.deg; save(); renderInput(); return;
      case 'UNIT': S.unitMode=!S.unitMode; save(); renderPad(); return;
      case '→': {   // 式全体の結果を変換：かっこを閉じて末尾に → を入れる
        if(S.tokens.includes('→')) return;
        if(!S.tokens.length){ if(!S.history.length) return; S.tokens=['ans']; }
        S.tokens.push(...Array(Math.max(0,openCount(S.tokens))).fill(')'),'→');
        S.cursor=S.tokens.length; renderInput(); return;
      }
      case '=': {
        if(!S.tokens.length) return;
        const st=eqState();
        if(st==='rhs'){   // 左辺を閉じて = を入れ、右辺の入力へ
          S.tokens.push(...Array(Math.max(0,openCount(S.tokens))).fill(')'),'=');
          S.cursor=S.tokens.length; renderInput(); return;
        }
        if(st==='solve'){
          try{
            const k=S.tokens.indexOf('='), L=S.tokens.slice(0,k), R=S.tokens.slice(k+1);
            if(!L.length) throw new Error('左辺がありません');
            if(!R.length) throw new Error('右辺を入力してください');
            const sol=solveX(L,R);
            S.history.push({t:[...S.tokens], v:sol.roots.length?sol.roots[0]:0, sol});
            if(sol.roots.length) S.ans=sol.roots[0]; S.ansQ=null;
            S.tokens=[]; S.cursor=0; save(); renderTape(); renderInput();
          }catch(e){ previewEl.classList.remove('hint'); previewEl.textContent=e.message; previewEl.classList.add('err'); }
          return;
        }
        try{
          commitEntry(computeEntry(S.tokens)); S.tokens=[]; S.cursor=0; convOpen=null;
          save(); renderTape(); renderInput();
        }catch(e){ previewEl.classList.remove('hint'); previewEl.textContent=e.message; previewEl.classList.add('err'); }
        return;
      }
      default:
        if(k.startsWith('CAT:')){
          const c=k.slice(4);
          if(c===S.unitCat&&UNIT_PAGES[c].length>1) S.unitPage=((S.unitPage||0)+1)%UNIT_PAGES[c].length;   // 電気はもう一度押すと次のページ
          else { S.unitCat=c; S.unitPage=0; }
          save(); renderPad(); return;
        }
        insert([k]);
    }
  }

  // ---- 単位モードのキーパッド：関数の2段を「種類」と「単位」に切り替える ----
  const sciKeys=[...document.querySelectorAll('.k.sci')];
  const sciOrig=sciKeys.map(b=>({k:b.dataset.k,html:b.innerHTML,cls:b.className,aria:b.getAttribute('aria-label')}));
  const pctKey=document.getElementById('pctKey'), unitKeyEl=document.getElementById('unitKey');
  function renderPad(){
    unitKeyEl.classList.toggle('on',!!S.unitMode); unitKeyEl.setAttribute('aria-pressed',S.unitMode?'true':'false');
    if(!S.unitMode){
      sciKeys.forEach((b,i)=>{ const o=sciOrig[i]; b.dataset.k=o.k; b.innerHTML=o.html; b.className=o.cls; if(o.aria) b.setAttribute('aria-label',o.aria); else b.removeAttribute('aria-label'); });
      pctKey.dataset.k='%'; pctKey.textContent='%'; pctKey.className='k'; pctKey.setAttribute('aria-label','パーセント');
      return;
    }
    if(!UNIT_PAGES[S.unitCat]) S.unitCat='len';
    const pages=UNIT_PAGES[S.unitCat], pg=Math.min(S.unitPage||0,pages.length-1), page=pages[pg];
    CATS.forEach(([c,label],i)=>{
      const b=sciKeys[i]; b.className='k sci cat'+(c===S.unitCat?' sel':''); b.dataset.k='CAT:'+c; b.setAttribute('aria-label',label+'の単位');
      b.innerHTML=label+(c===S.unitCat&&pages.length>1?'<small>'+(pg+1)+'/'+pages.length+'</small>':'');
    });
    for(let i=CATS.length;i<5;i++){ const b=sciKeys[i]; b.className='k sci blank'; b.dataset.k=''; b.textContent=''; b.removeAttribute('aria-label'); }
    for(let i=0;i<5;i++){
      const b=sciKeys[5+i], key=page[i];
      if(key){ b.className='k sci unitk'; b.dataset.k='u:'+key; b.textContent=UNITS[key].label; b.setAttribute('aria-label',UNITS[key].label); }
      else { b.className='k sci blank'; b.dataset.k=''; b.textContent=''; b.removeAttribute('aria-label'); }
    }
    pctKey.dataset.k='→'; pctKey.textContent='→'; pctKey.className='k conv-key'; pctKey.setAttribute('aria-label','単位を変換する');
  }

  // 素早い連打でも取りこぼさないよう、click ではなく「触れた瞬間（pointerdown）」で入力する
  const padEl=document.getElementById('pad'); let lastPtr=0;
  padEl.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0) return;
    const b=e.target.closest('[data-k]'); if(!b||!b.dataset.k) return;
    lastPtr=Date.now();
    e.preventDefault();                 // ダブルタップ拡大・フォーカス移動・遅延clickを抑止
    b.classList.add('hit'); setTimeout(()=>b.classList.remove('hit'),110);
    press(b.dataset.k);
  });
  // キーボード操作（Tab で選んで Enter/Space）の場合だけ click で入力
  padEl.addEventListener('click',e=>{ if(e.detail!==0||Date.now()-lastPtr<1000) return; const b=e.target.closest('[data-k]'); if(b&&b.dataset.k) press(b.dataset.k); });
  padEl.addEventListener('dblclick',e=>e.preventDefault());
  padEl.addEventListener('contextmenu',e=>e.preventDefault());

  // 式の任意の位置をタップしてカーソル移動
  inputEl.addEventListener('click',e=>{
    const p=e.target.closest('.ph,.rsign');
    if(p){ S.cursor=+p.dataset.c; renderInput(); return; }
    const s=e.target.closest('.t');
    if(!s){ if(e.target.closest('.frac')) return; S.cursor=S.tokens.length; renderInput(); return; }
    const r=s.getBoundingClientRect(), i=+s.dataset.i;
    S.cursor = e.clientX < r.left+r.width/2 ? i : i+1; renderInput();
  });

  // 履歴消去：押したら即消去
  document.getElementById('clearHist').addEventListener('click',()=>{ S.history=[]; convOpen=null; save(); renderTape(); });
  degBtn.addEventListener('click',()=>press('DEG'));
  const copyBtn=document.getElementById('copyBtn');
  function renderCopyBtn(){ copyBtn.textContent=S.copyMode?'CLIP COPY':'INSERT'; copyBtn.classList.toggle('on',!!S.copyMode); copyBtn.setAttribute('aria-pressed',S.copyMode?'true':'false'); }
  copyBtn.addEventListener('click',()=>{ S.copyMode=!S.copyMode; save(); renderCopyBtn(); });
  renderCopyBtn();

  // ===== キーボード入力（PC用） =====
  // 日本語IMEがオンのとき、Windowsでは e.key が 'Process' になり数字や記号が取れないことがある。
  // そのため e.code（物理キー）からも入力を判定する。全角文字で届く場合も半角に直す。
  const KEYMAP={
    '+':'+','-':'−','−':'−','*':'×','×':'×','/':'÷','÷':'÷','^':'^','%':'%','(':'(',')':')','.':'.',',':'.','。':'.',
    '=':'=','Enter':'=','Backspace':'BS','Escape':'AC','ArrowLeft':'LEFT','ArrowRight':'RIGHT','→':'→'
  };
  // 英字の入力：関数名（sin など）と単位（mm・kg・m/min など）を判別する
  //  ・候補が1つに決まった時点で確定（例：k→g で kg、s→i→n で sin）
  //  ・まだ候補が残る場合（m → mm・min・m/min など）は、次に数字や記号を押した時点で確定
  //  ・単位は大文字小文字を区別（A・V・W）。区別しなくても1つに決まれば受け付ける（a→A、kw→kW）
  const WORDS={sin:'sin(',cos:'cos(',tan:'tan(',log:'log(',ln:'ln(',sqrt:'√(',pi:'π',ans:'ans'};
  const UNIT_ALIAS={um:MU,s:'sec',ms:'msec','m/s':'m/sec','mm/s':'mm/sec'};
  let wordBuf='', wordTimer=null;
  function lookupUnit(w){
    if(UNITS[w]) return w;
    const lw=w.toLowerCase(); if(UNIT_ALIAS[lw]) return UNIT_ALIAS[lw];
    const ci=UNIT_KEYS.filter(k=>k.toLowerCase()===lw); return ci.length===1?ci[0]:null;
  }
  const exactWord=w=>!!(WORDS[w.toLowerCase()]||lookupUnit(w));
  function hasLonger(w){
    const lw=w.toLowerCase();
    return Object.keys(WORDS).some(k=>k.length>lw.length&&k.startsWith(lw))
        || Object.keys(UNIT_ALIAS).some(k=>k.length>lw.length&&k.startsWith(lw))
        || UNIT_KEYS.some(k=>k.length>w.length&&(k.startsWith(w)||k.toLowerCase().startsWith(lw)));
  }
  const possibleWord=w=>exactWord(w)||hasLonger(w);
  const showWord=()=>{ previewEl.classList.remove('err'); previewEl.classList.add('hint'); previewEl.textContent=wordBuf+'…'; };
  const hideWord=()=>{ if(previewEl.classList.contains('hint')){ previewEl.textContent=''; previewEl.classList.remove('hint'); } };
  function commitWord(w){
    const lw=w.toLowerCase();
    if(WORDS[lw]){ press(WORDS[lw]); flashKey(WORDS[lw]); return true; }
    const u=lookupUnit(w); if(u){ insert(['u:'+u]); return true; }
    if(w.length>1&&w.endsWith('/')&&commitWord(w.slice(0,-1))){ press('÷'); return true; }   // 「m/」の後に単位が続かなければ割り算
    previewEl.classList.remove('hint'); previewEl.textContent='「'+w+'」は使えません'; previewEl.classList.add('err'); return false;
  }
  function flushWord(){ if(!wordBuf) return; const w=wordBuf; wordBuf=''; clearTimeout(wordTimer); hideWord(); commitWord(w); }
  const clearWord=flushWord;
  // 1文字（英字、または単位の途中の /）を受け取る。受け付けたら true
  function typeChar(ch){
    if(ch==='/'){ if(wordBuf&&possibleWord(wordBuf+'/')){ wordBuf+='/'; showWord(); clearTimeout(wordTimer); wordTimer=setTimeout(flushWord,1500); return true; } return false; }
    if(wordBuf&&!possibleWord(wordBuf+ch)) flushWord();          // 続かない文字 → ここまでを確定
    wordBuf+=ch;
    if(!possibleWord(wordBuf)){ const w=wordBuf; wordBuf=''; clearTimeout(wordTimer); previewEl.classList.remove('hint'); previewEl.textContent='「'+w+'」は使えません'; previewEl.classList.add('err'); return true; }
    if(exactWord(wordBuf)&&!hasLonger(wordBuf)){ flushWord(); return true; }
    showWord(); clearTimeout(wordTimer); wordTimer=setTimeout(flushWord,1500);
    return true;
  }
  function flashKey(k){ const b=document.querySelector(`[data-k="${CSS.escape(k)}"]`); if(b){ b.classList.add('hit'); setTimeout(()=>b.classList.remove('hit'),90); } }
  function forwardDelete(){ if(S.cursor<S.tokens.length){ S.cursor++; press('BS'); } }

  // --- 物理キー(e.code)から文字を求める（IMEオン時の保険） ---
  // JIS配列／US配列で記号の位置が違うので、通常入力で覚えた対応を優先し、無ければ既定の配列表を使う
  const learned={};
  let isJIS=/^ja/i.test(navigator.language||'');
  try{ if(navigator.keyboard&&navigator.keyboard.getLayoutMap) navigator.keyboard.getLayoutMap().then(m=>{ const q=m.get('Equal'); if(q==='^') isJIS=true; else if(q==='=') isJIS=false; }).catch(()=>{}); }catch(e){}
  const LAYOUT_JIS={'Minus|0':'-','Minus|1':'=','Equal|0':'^','Semicolon|1':'+','Quote|1':'*','Slash|0':'/','Period|0':'.','Comma|0':',','Digit5|1':'%','Digit8|1':'(','Digit9|1':')','Period|1':'>'};
  const LAYOUT_US ={'Minus|0':'-','Equal|0':'=','Equal|1':'+','Slash|0':'/','Period|0':'.','Comma|0':',','Digit5|1':'%','Digit6|1':'^','Digit8|1':'*','Digit9|1':'(','Digit0|1':')','Period|1':'>'};
  const NAMED_CODE={Enter:'Enter',NumpadEnter:'Enter',Backspace:'Backspace',Delete:'Delete',Escape:'Escape',ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',ArrowUp:'ArrowUp',ArrowDown:'ArrowDown',Home:'Home',End:'End'};
  const NUMPAD_CODE={NumpadAdd:'+',NumpadSubtract:'-',NumpadMultiply:'*',NumpadDivide:'/',NumpadDecimal:'.',NumpadEqual:'='};
  function keyFromCode(e){
    const c=e.code||'', sh=e.shiftKey?1:0;
    if(NAMED_CODE[c]) return NAMED_CODE[c];
    if(/^Numpad[0-9]$/.test(c)) return c.slice(6);
    if(NUMPAD_CODE[c]) return NUMPAD_CODE[c];
    if(/^Digit[0-9]$/.test(c) && !sh) return c.slice(5);
    if(/^Key[A-Z]$/.test(c)) return sh?c.slice(3):c.slice(3).toLowerCase();
    return learned[c+'|'+sh] || (isJIS?LAYOUT_JIS:LAYOUT_US)[c+'|'+sh] || null;
  }
  // --- 履歴の呼び出し（↑↓）。入力途中の式は ↓ で戻れるよう保存する ---
  let histPos=-1, draft=null;
  const endRecall=()=>{ histPos=-1; draft=null; };
  function recall(dir){
    if(!S.history.length) return;
    if(histPos<0){
      if(dir>0) return;
      draft={tokens:[...S.tokens],cursor:S.cursor}; histPos=S.history.length-1;
    } else histPos+=dir;
    if(histPos>=S.history.length){
      const d=draft; endRecall(); S.tokens=d?d.tokens:[]; S.cursor=d?d.cursor:0; renderInput(); return;
    }
    if(histPos<0) histPos=0;
    const t=expandAnsTokens(S.history[histPos].t,histPos-1); S.tokens=[...t]; for(let i=openCount(t);i>0;i--) S.tokens.push(')');
    S.cursor=S.tokens.length; renderInput();
  }

  function handleKeydown(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;            // コピー・貼り付けなどはブラウザに任せる
    if(e.target&&e.target.closest&&e.target.closest('input,textarea,[contenteditable="true"]')) return;
    let key=e.key||'';
    const ime=['Process','Unidentified','Dead'].includes(key)||(e.isComposing&&key.length!==1);
    if(ime){ key=keyFromCode(e); if(!key) return; }
    else{
      key=key.length>1?key:key.normalize('NFKC');         // 全角の１ ＋ （ ）などを半角に
      if(key.length===1&&e.code) learned[e.code+'|'+(e.shiftKey?1:0)]=key;
    }
    // 英字：x は変数X、それ以外は関数名・単位
    if(/^[a-zA-Z\u03BC]$/.test(key)){
      e.preventDefault();
      if(key==='x'||key==='X'){ if(!wordBuf){ endRecall(); press('X'); flashKey('X'); return; } }
      endRecall(); typeChar(key); return;
    }
    // 単位の途中の /（m/min など）
    if(key==='/'&&wordBuf&&typeChar('/')){ e.preventDefault(); return; }
    // ここから先は英字以外：入力途中の英字を確定してから処理する
    flushWord();
    if(/^[0-9]$/.test(key)){ e.preventDefault(); endRecall(); press(key); flashKey(key); return; }
    if(key==='>'){                                       // → （「->」と打った場合は − を → に置き換え）
      e.preventDefault(); endRecall();
      if(S.cursor>0&&S.tokens[S.cursor-1]==='−'){ S.tokens.splice(S.cursor-1,1); S.cursor--; }
      press('→'); flashKey('→'); return;
    }
    if(key==='Delete'){ e.preventDefault(); forwardDelete(); return; }
    if(key==='Home'){ e.preventDefault(); S.cursor=0; renderInput(); return; }
    if(key==='End'){ e.preventDefault(); S.cursor=S.tokens.length; renderInput(); return; }
    if(key==='ArrowUp'){ e.preventDefault(); recall(-1); return; }
    if(key==='ArrowDown'){ e.preventDefault(); recall(1); return; }
    const k=KEYMAP[key]; if(!k) return;
    e.preventDefault(); if(k!=='LEFT'&&k!=='RIGHT') endRecall();
    press(k); flashKey(k);
  }
  document.addEventListener('keydown',handleKeydown);

  // --- キー入力が確実にこのページへ届くようにする（別タブ・iframe内・フォーカス外れ対策） ---
  const grabFocus=()=>{ try{ window.focus(); }catch(e){} };
  document.body.tabIndex=-1;
  window.addEventListener('load',()=>{ grabFocus(); try{ document.body.focus({preventScroll:true}); }catch(e){} });
  document.addEventListener('pointerdown',grabFocus,true);

  // ===== 貼り付け（Ctrl+V / ⌘+V）：文字の式を取り込む =====
  function parseText(str){
    str=str.normalize('NFKC'); const out=[]; let i=0;
    const MAP={'+':'+','-':'−','−':'−','*':'×','×':'×','/':'÷','÷':'÷','^':'^','%':'%','(':'(',')':')','=':'=','→':'→'};
    const FN={sin:'sin(',cos:'cos(',tan:'tan(',log:'log(',ln:'ln(',sqrt:'√('};
    while(i<str.length){
      const c=str[i];
      if(/\s/.test(c)||c===','){ i++; continue; }
      if(/[0-9.]/.test(c)){ out.push(c); i++; continue; }
      if((c==='-'||c==='−')&&str[i+1]==='>'){ out.push('→'); i+=2; continue; }
      if(MAP[c]){ out.push(MAP[c]); i++; continue; }
      if(c==='π'){ out.push('π'); i++; continue; }
      if(c==='√'){ out.push('√('); i++; if(str[i]==='(') i++; continue; }
      const m=str.slice(i).match(/^[A-Za-z\u03BC]+/);
      if(m){
        const raw=m[0], w=raw.toLowerCase(); i+=raw.length;
        if(FN[w]){ out.push(FN[w]); if(str[i]==='(') i++; continue; }
        if(w==='pi'){ out.push('π'); continue; }
        if(w==='ans'){ out.push('ans'); continue; }
        if(w==='x'){ out.push('X'); continue; }
        if(str[i]==='/'){                      // m/min などの複合単位
          const m2=str.slice(i+1).match(/^[A-Za-z]+/);
          if(m2){ const cu=lookupUnit(raw+'/'+m2[0]); if(cu&&cu.includes('/')){ out.push('u:'+cu); i+=1+m2[0].length; continue; } }
        }
        const u=lookupUnit(raw); if(u){ out.push('u:'+u); continue; }
        throw new Error('「'+raw+'」は使えません');
      }
      throw new Error('「'+c+'」は使えない文字です');
    }
    return out;
  }
  document.addEventListener('paste',e=>{
    let text=(e.clipboardData||window.clipboardData).getData('text'); if(!text) return;
    e.preventDefault();
    { const eqi=text.normalize('NFKC').indexOf('=');          // 「5m/min×3min = 15 m」→ 式の部分だけ（X を含む方程式は全体）
      if(eqi>=0&&!/x/i.test(text.normalize('NFKC').slice(0,eqi))) text=text.normalize('NFKC').slice(0,eqi); }
    try{ const t=parseText(text); if(t.filter(x=>x==='=').length>1) throw new Error('= は1つだけ使えます'); S.tokens.splice(S.cursor,0,...t); S.cursor+=t.length; renderInput(); }
    catch(err){ previewEl.classList.remove('hint'); previewEl.textContent='貼り付けできません：'+err.message; previewEl.classList.add('err'); }
  });
  // ===== コピー（Ctrl+C / ⌘+C）：入力中の式、空なら直前の答え =====
  document.addEventListener('copy',e=>{
    const sel=window.getSelection&&String(window.getSelection()); if(sel) return;
    const txt=S.tokens.length? tokensToText(S.tokens)
                             : (S.history.length?answerText(S.history[S.history.length-1]):'');
    if(!txt) return;
    e.clipboardData.setData('text/plain',txt); e.preventDefault();
  });

  renderPad(); renderTape(); renderInput();
})();
</script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
